<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RiseGrid – Privacy Policy and Support</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="Privacy policy and support for RiseGrid, an upside-down block puzzle game for iPhone and iPad where the pieces rise.">
<style>
  :root {
    --bg: #101114;
    --text: #f2f2f4;
    --muted: #a3a6ad;
    --line: #2a2c33;
    --link: #5fd4e6;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f6f8;
      --text: #14151a;
      --muted: #5b5e66;
      --line: #dcdde2;
      --link: #0b6f82;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 17px/1.6 "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main { width: 100%; max-width: 480px; }

  h1 { margin: 0 0 4px; font-size: 2rem; line-height: 1.2; }
  .lede { margin: 0 0 32px; color: var(--muted); }

  nav a {
    display: block;
    padding: 16px 0;
    border-top: 1px solid var(--line);
    color: var(--link);
    text-decoration: none;
    font-weight: 600;
  }
  nav a:last-child { border-bottom: 1px solid var(--line); }
  nav a span { display: block; margin-top: 2px; color: var(--muted); font-weight: 400; font-size: 0.9rem; }
  nav a:hover { text-decoration: underline; }
  nav a:focus-visible { outline: 2px solid var(--link); outline-offset: 4px; }
  .app-icon { display: block; width: 72px; height: 72px; border-radius: 22.5%; margin-bottom: 24px; }
</style>
</head>
<body>
<main>
  <img class="app-icon" src="risegrid-icon.png" width="72" height="72" alt="">

  <h1>RiseGrid</h1>
  <p class="lede">Privacy and support information for the RiseGrid app.</p>

  <nav>
    <a href="risegrid-privacy-policy.html">Privacy Policy
      <span>What the app stores and what it does not collect.</span>
    </a>
    <a href="risegrid-support.html">Support
      <span>Help with the game and how to get in touch.</span>
    </a>
  </nav>
</main>
</body>
</html>
